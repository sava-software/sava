# JUL configuration for the validate profile only. Identical to soak-logging.properties except
# that the websocket engine logs at FINE.
#
# validate runs for minutes, not hours, and its job is to shake out the instrumentation: the
# engine's per-send DEBUG records are what confirm that a send observed by the harness is a send
# the engine actually made, and that the peer's view of a frame and the client's view of it line
# up. At the pilot's and campaign's rates the same setting would be the largest cost in the run
# and would tell nobody anything the peer log does not already record, which is why there are two
# files rather than one knob.

handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.SimpleFormatter.format = %1$tFT%1$tT.%1$tL %4$s %3$s: %5$s%6$s%n

# Every text write and send, for the length of a 240 s validate run.
software.sava.rpc.json.http.ws.SolanaJsonRpcWebsocket.level = FINE

# The issue #52 fingerprint; see the note in soak-logging.properties.
software.sava.services.solana.websocket.WebSocketManagerImpl.level = INFO

software.sava.rpc.soak.level = INFO

# JUL configuration for the soak client JVM (pilot, campaign, control and live profiles).
# Passed as -Djava.util.logging.config.file=<run>/config/soak-logging.properties; soak.sh copies
# this file into the run directory so the artifacts record the exact configuration used.
#
# One line per record on stderr, and nothing else: the run's evidence lives in the TSV, CSV and
# properties artifacts and in the flight recording, not in the log. The log is for a human
# reading why a run went wrong, and for ManagerLogCapture, which attaches its own handler to the
# ravina manager's logger and classifies its message prefixes.

handlers = java.util.logging.ConsoleHandler
.level = INFO

# ConsoleHandler writes to System.err, which soak.sh merges into logs/client.log.
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# ISO-8601 instant, level, logger, message, then the throwable if there is one.
java.util.logging.SimpleFormatter.format = %1$tFT%1$tT.%1$tL %4$s %3$s: %5$s%6$s%n

# The websocket engine logs every text write and every send at DEBUG (JUL FINE). Over hours at
# the campaign's notification rate that is the largest single cost in the run and none of it is
# evidence: the peer's own log records every frame it wrote, with sequence numbers. WARNING keeps
# the drops, the rejections and the fatal collisions, which are the records that matter.
software.sava.rpc.json.http.ws.SolanaJsonRpcWebsocket.level = WARNING

# The ravina manager's INFO records ARE evidence for issue #52: "Websocket connection attempt
# failed. Re-connecting in N milliseconds.", "Websocket closed [statusCode=...]", "Websocket
# failure. Re-connecting in N milliseconds.", "WebSocket connected to ..." and "Websocket became
# terminal while connecting." are how the harness tells the future route from the callback route
# for one transport failure. Below INFO, the fingerprint the issue turns on disappears.
software.sava.services.solana.websocket.WebSocketManagerImpl.level = INFO

# The harness itself.
software.sava.rpc.soak.level = INFO

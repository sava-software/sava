name: Gradle Check

on:
  push:
    branches:
      - main
  # A manual run warms the Gradle cache a fork pull request restores read-only, which
  # a quiet main lets expire.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    uses: sava-software/sava-build/.github/workflows/build.yml@main
    secrets: inherit
